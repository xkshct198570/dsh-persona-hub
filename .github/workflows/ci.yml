name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (lockfile frozen)
        run: npm ci --no-audit --no-fund

      - name: Static gates
        run: node scripts/check.mjs
      - name: i18n single source
        run: node scripts/i18n-check.mjs
      - name: Tests（npm test：pretest 生成物/体量/基线 + posttest 计数闸）
        run: npm test
